name: Validate and package WRHA Moodle prototype

on:
  push:
    branches: [main, academy-comprehensive-27-lessons-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scorm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check motion.js
          node --check ambient-motion.js
          node --check logo-loader.js
          node --check assets/original-logo-data.js
          node --check course-data.js
          node --check lessons-unit-1.js
          node --check lessons-unit-2.js
          node --check lessons-module-7.js
          node --check lessons-module-8.js
          node --check lessons-module-9.js
          node --check practice-tools.js
          node --check expanded-lesson-renderer.js
          node --check extended-assessment.js
          node --check module-visuals.js
          node --check video-library.js
          node --check manual-reader.js
          node --check manual-assets.js
          node --check module-resources.js
          node --check guideline-library.js
          node --check scorm.js

      - name: Validate course content and SCORM manifest
        run: |
          node -e "global.window = {}; require('./course-data.js'); const c=window.WRHA_COURSE; if(!c||c.modules.length!==9||c.modules.some(m=>m.scenario.choices.filter(x=>x.correct).length!==1)) process.exit(1); console.log('Validated nine modules and scenario answers')"
          node <<'NODE'
          global.window={};
          for(const p of ['lessons-unit-1.js','lessons-unit-2.js','lessons-module-7.js','lessons-module-8.js','lessons-module-9.js','practice-tools.js'])require('./'+p);
          const x=window.WRHA_EXPANDED_LESSONS,t=window.WRHA_PRACTICE_TOOLS;
          if(!x||Object.keys(x).length!==9)throw Error('Expected nine expanded modules');
          const ids=new Set();
          for(let i=1;i<=9;i++){
            if(!Array.isArray(x[i])||x[i].length!==3)throw Error('Expected three complete lessons in module '+i);
            for(const [j,l] of x[i].entries()){
              if(l.id!==i+'.'+(j+1)||ids.has(l.id))throw Error('Duplicate or misplaced lesson '+l.id);
              ids.add(l.id);
              if(!l.objective||!Array.isArray(l.p)||l.p.length<3||l.p.some(p=>p.length<100)||!l.case||!l.activity||!l.takeaway||!l.ref)throw Error('Incomplete teaching for '+l.id);
              if(!l.check||l.check.a.length!==3||l.check.why.length!==3||!Number.isInteger(l.check.correct)||l.check.correct<0||l.check.correct>2)throw Error('Invalid formative question '+l.id);
            }
          }
          if(ids.size!==27||!Array.isArray(t)||t.length!==10)throw Error('Expected 27 lessons and 10 tools');
          global.document={addEventListener:()=>{}};
          require('./extended-assessment.js');
          if(window.WRHA_EXTENDED_PRACTICE_COUNT!==18)throw Error('Expected 18 extended assessment questions');
          console.log('Validated '+ids.size+' substantive lessons, 27 formative checks, and '+t.length+' printable learning tools');
          NODE
          node <<'NODE'
          global.window={};
          require('./video-library.js');
          const items=window.WRHA_VIDEO_LIBRARY;
          if(!Array.isArray(items)||items.length!==9)throw Error('Expected exactly nine learning videos');
          const vids=new Set(), mods=new Set();
          for(const v of items){
            if(!/^[A-Za-z0-9_-]{11}$/.test(v.videoId))throw Error('Invalid YouTube video ID: '+v.id);
            if(vids.has(v.videoId))throw Error('Duplicate YouTube video: '+v.videoId);
            vids.add(v.videoId);
            if(!Array.isArray(v.modules)||v.modules.length!==1||!Number.isInteger(v.modules[0]))throw Error('Expected exactly one module for '+v.id);
            if(mods.has(v.modules[0]))throw Error('Module has multiple videos: '+v.modules[0]);
            mods.add(v.modules[0]);
            if(!v.before||!Array.isArray(v.watchFor)||v.watchFor.length<2||!Array.isArray(v.after)||v.after.length<2||!v.localScenario||!v.caveat)throw Error('Missing observation or Jamaican application: '+v.id);
            if(!/^https:\/\//.test(v.source))throw Error('Unsafe publisher URL: '+v.id);
          }
          for(let i=1;i<=9;i++)if(!mods.has(i))throw Error('Missing video for module '+i);
          console.log('Verified nine unique videos, nine module assignments and all reflection prompts');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('imsmanifest.xml')
          for name in ('index.html','styles.css','premium.css','course.css','expanded-lessons.css','lessons-unit-1.js','lessons-unit-2.js','lessons-module-7.js','lessons-module-8.js','lessons-module-9.js','practice-tools.js','expanded-lesson-renderer.js','extended-assessment.js','illustrations.css','readability.css','ambient-motion.js','module-visuals.js','videos.css','manual-reader.css','manual-covers.css','manual-reader.js','manual-assets.js','vendor/pdfjs/pdf.min.js','vendor/pdfjs/pdf.worker.min.js','video-library.js','motion.js','logo-loader.js','assets/original-logo-data.js','course-data.js','guideline-library.js','app.js','scorm.js','assets/wrha-logo.svg'):
              assert Path(name).exists(), name
          for photo in ['cha-ncd-overview','cha-adherence-conversation','cha-barriers-home-visit',
                        'cha-communication-education','cha-motivational-interviewing','cha-five-as-assessment',
                        'cha-danger-signs-monitoring','cha-self-management-activity','cha-documentation-follow-up',
                        'cha-unit-1','cha-unit-2','cha-unit-3']:
              file = Path(f'assets/cha-hd/{photo}.webp')
              assert file.is_file() and file.read_bytes()[:4] == b'RIFF', f'Missing HD image {file}'
          ET.parse('assets/wrha-logo.svg')
          print('Manifest and logo SVG parse successfully')
          PY

      - name: Restore original logo as a standalone PNG for Moodle
        run: |
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          global.window = {};
          require("./assets/original-logo-data.js");
          const parts = window.WRHA_EXACT_LOGO_PARTS;
          if (!Array.isArray(parts) || parts.length !== 5) throw new Error("Original logo data is missing");
          const png = Buffer.from(parts.join(""), "base64");
          const expected = "f11785b18268f07b96bab636e14918a1284eab6904f72466bae1ed2a607f2b97";
          const sha = crypto.createHash("sha256").update(png).digest("hex");
          if (sha !== expected) throw new Error("WRHA original logo checksum mismatch");
          fs.writeFileSync("assets/wrha-logo-original.png", png);
          const originalPath = "assets/wrha-logo.svg";
          const newPath = "assets/wrha-logo-original.png";
          fs.writeFileSync("index.html", fs.readFileSync("index.html","utf8").replaceAll(originalPath,newPath));
          fs.writeFileSync("imsmanifest.xml", fs.readFileSync("imsmanifest.xml","utf8").replaceAll(originalPath,newPath));
          console.log("Restored the original pixel-exact logo for SCORM deployment");
          NODE

      - name: Add any synced PDFs and authentic first-page covers to SCORM manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest=Path('imsmanifest.xml')
          ET.register_namespace('', 'http://www.imsproject.org/xsd/imscp_rootv1p1p2')
          ET.register_namespace('adlcp','http://www.adlnet.org/xsd/adlcp_rootv1p2')
          tree=ET.parse(manifest)
          namespace='{http://www.imsproject.org/xsd/imscp_rootv1p1p2}'
          parent=tree.find('.//'+namespace+'resource')
          assert parent is not None
          assets=(sorted(Path('documents/pdf-library').glob('*.pdf'))+sorted(Path('media/pdf-covers').glob('*.webp')))
          for asset in assets:
              ET.SubElement(parent,namespace+'file',{'href':asset.as_posix()})
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          print('SCORM includes',len(assets),'locally hosted PDF/cover assets')
          PY

      - name: Build SCORM 1.2 ZIP
        run: |
          zip -q -r WRHA-NCD-Adherence-Academy-SCORM12-PROTOTYPE.zip \
            imsmanifest.xml index.html styles.css premium.css course.css expanded-lessons.css lessons-unit-1.js lessons-unit-2.js lessons-module-7.js lessons-module-8.js lessons-module-9.js practice-tools.js expanded-lesson-renderer.js extended-assessment.js illustrations.css readability.css ambient-motion.js module-visuals.js videos.css manual-reader.css manual-covers.css course-data.js video-library.js guideline-library.js manual-assets.js manual-reader.js vendor/pdfjs/pdf.min.js vendor/pdfjs/pdf.worker.min.js app.js motion.js scorm.js logo-loader.js assets/original-logo-data.js assets/wrha-logo-original.png
          if [ -d assets/cha-hd ]; then zip -q -r WRHA-NCD-Adherence-Academy-SCORM12-PROTOTYPE.zip assets/cha-hd; fi
          if [ -d documents/pdf-library ] && [ -d media/pdf-covers ]; then
            zip -q -r WRHA-NCD-Adherence-Academy-SCORM12-PROTOTYPE.zip documents/pdf-library media/pdf-covers
          fi

      - name: Upload Moodle trial package
        uses: actions/upload-artifact@v4
        with:
          name: WRHA-NCD-SCORM12-Prototype
          path: WRHA-NCD-Adherence-Academy-SCORM12-PROTOTYPE.zip
          if-no-files-found: error
