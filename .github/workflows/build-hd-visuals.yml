name: Build retina-ready CHA illustrations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-hd-visuals.yml'
      - 'scripts/build_hd_cha_visuals.py'

permissions:
  contents: write

concurrency:
  group: wrha-hd-visuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out WRHA course
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-processing libraries
        run: python -m pip install --disable-pip-version-check --quiet pillow numpy opencv-contrib-python-headless
      - name: Super-resolve and export full-resolution WebP pictures
        run: python scripts/build_hd_cha_visuals.py
      - name: Confirm all twelve outputs and source dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          images=sorted(Path('assets/cha-hd').glob('cha-*.webp'))
          assert len(images)==12, f'Expected 12 scenes, got {len(images)}'
          for file in images:
              with Image.open(file) as image:
                  is_banner=file.name in {'cha-group-education.webp','cha-family-counselling.webp','cha-physical-activity.webp'}
                  if is_banner:
                      assert image.width>=760 and image.height>=280,(file,image.size)
                  else:
                      assert image.size==(1448,1086),(file,image.size)
                  assert image.format=='WEBP',file
              print(file)
          PY
      - name: Commit optimized images without modifying course logic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cha-hd
          if git diff --staged --quiet; then
            echo 'No new illustrations to commit'
          else
            git commit -m 'Build 12 HD enhanced WRHA CHA illustrations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
